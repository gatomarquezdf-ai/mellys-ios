name: DistribuidoraMelys
options:
  bundleIdPrefix: com.distribuidoramelys
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.5.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DistribuidoraMelys:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: DistribuidoraMelys
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.distribuidoramelys.app
        INFOPLIST_FILE: DistribuidoraMelys/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
